<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تحلیل قیمت آگهی‌های خودرو</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1320;
    --card: #141f33;
    --card-border: #263248;
    --header-bg: #0f3d3a;
    --accent: #2dd4bf;
    --accent-bright: #5eead4;
    --text: #e7ecf3;
    --text-dim: #93a1b8;
    --text-faint: #5c6b85;
    --danger: #fca5a5;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(45, 212, 191, 0.07), transparent 45%);
    color: var(--text);
    font-family: "Vazirmatn", Tahoma, sans-serif;
    padding: 28px 32px 60px;
    margin: 0;
  }

  .page-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  h1 {
    color: var(--accent-bright);
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.6);
    animation: pulse 2.2s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(45, 212, 191, 0); }
    100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
  }

  h3 {
    color: var(--accent-bright);
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset, 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .result-count {
    font-size: 13px;
    color: var(--text-faint);
  }

  /* پنل افزودن کانال */
  .channels-panel {
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .channel-add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .channel-add-row input { max-width: 240px; }
  .channel-preview {
    font-size: 13px;
    color: var(--text-faint);
    min-width: 140px;
    transition: color 0.15s;
  }
  .channel-preview.loading { color: var(--text-dim); }
  .channel-preview.found { color: #6ee7b7; }
  .channel-preview.not-found { color: var(--danger); }

  .channel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .channel-row .channel-name { font-size: 14px; }
  .channel-status {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 500;
  }
  .channel-status.active { background: #064e3b; color: #6ee7b7; }
  .channel-status.inactive { background: #3f1d1d; color: var(--danger); }

  /* جدول */
  table {
    width: 100%;
    border-collapse: collapse;
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  th, td {
    padding: 12px 16px;
    text-align: right;
    border-bottom: 1px solid var(--card-border);
    font-size: 13.5px;
  }
  th {
    background: var(--header-bg);
    color: var(--accent-bright);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  th.row-num, td.row-num {
    text-align: center;
    color: var(--text-faint);
    width: 36px;
  }
  tbody tr { cursor: pointer; transition: background 0.12s; }
  tbody tr:hover { background: #1b2a45; }
  tbody tr:last-child td { border-bottom: none; }
  td.empty-cell {
    text-align: center;
    color: var(--text-faint);
    padding: 32px 0;
    cursor: default;
  }
  .no-price { color: var(--text-faint); }

  /* صفحه‌بندی */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding: 0 4px;
  }
  .pagination-info {
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .pagination-buttons {
    display: flex;
    gap: 8px;
  }
  .pagination-buttons button {
    padding: 5px 14px;
    font-size: 13px;
  }
  .pagination-buttons button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  input[type="text"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .toolbar input[type="text"] { min-width: 260px; }

  button {
    background: var(--header-bg);
    color: var(--accent-bright);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #115049; }
  button:active:not(:disabled) { transform: scale(0.97); }

  /* مدال‌ها */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 9, 16, 0.72);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-box {
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 720px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
    animation: modal-in 0.16s ease-out;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.97) translateY(4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
  }
  .modal-header h2 {
    margin: 0;
    color: var(--accent-bright);
    font-size: 16.5px;
    font-weight: 700;
  }
  .modal-header button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    padding: 4px 8px;
  }
  .modal-header button:hover:not(:disabled) { background: none; color: var(--text); }
  .modal-search-area {
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
  }
  .modal-search-area input { width: 100%; }
  #modalMeta {
    padding: 8px 20px;
    color: var(--text-dim);
    font-size: 12.5px;
  }
  #modalList, #channelsModalList {
    overflow-y: auto;
    padding: 14px 20px;
    flex: 1;
  }
  .ad-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .ad-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
  }
  .price-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .price-group strong { font-size: 14.5px; }
  .price-badge {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 500;
  }
  .price-badge.min { background: #064e3b; color: #6ee7b7; }
  .price-badge.max { background: #7c2d12; color: #fdba74; }
  .price-badge.equal { background: #1e3a8a; color: #93c5fd; }
  .ad-link {
    color: var(--accent-bright);
    font-size: 12.5px;
    text-decoration: none;
    white-space: nowrap;
  }
  .ad-link:hover { text-decoration: underline; }
  .ad-details { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
  .ad-phone { font-size: 13px; margin-bottom: 4px; }
  .ad-notes { color: #cbd5e1; font-size: 13px; margin-bottom: 7px; }
  .ad-text {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    font-size: 13px;
    color: #cbd5e1;
    white-space: pre-wrap;
    margin-bottom: 7px;
    line-height: 1.6;
  }
  .ad-date { color: var(--text-faint); font-size: 11px; text-align: left; }
  .empty { color: var(--text-faint); text-align: center; padding: 34px 0; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="page-header">
    <h1>تحلیل قیمت آگهی‌های خودرو</h1>
    <span class="live-dot" title="بروزرسانی خودکار هر ۱۰ ثانیه"></span>
  </div>

  <div class="card channels-panel">
    <h3>مدیریت کانال‌ها</h3>
    <div class="channel-add-row">
      <input type="text" id="newChannelInput" placeholder="نام کاربری کانال (بدون @)" oninput="onChannelInputChange()" />
      <span id="channelPreview" class="channel-preview"></span>
      <button onclick="addChannel()">افزودن</button>
      <button onclick="openChannelsModal()">لیست کانال‌ها</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchTable" placeholder="جستجوی مدل خودرو..." oninput="onSearchInput()" />
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="card">
    <table id="result">
      <thead>
        <tr>
          <th class="row-num">ردیف</th>
          <th>مدل خودرو</th>
          <th>تعداد کل آگهی</th>
          <th>آگهی با قیمت</th>
          <th>حداقل قیمت</th>
          <th>میانگین قیمت</th>
          <th>حداکثر قیمت</th>
          <th>آخرین آگهی</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

  <!-- مدال جزئیات هر مدل خودرو -->
  <div id="modalOverlay" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button onclick="closeModal()">✕ بستن</button>
      </div>
      <div class="modal-search-area">
        <input type="text" id="searchModal" placeholder="جستجو در آگهی‌ها (تلفن، رنگ، توضیحات، متن پیام...)" oninput="filterModalAds()" />
      </div>
      <div id="modalMeta"></div>
      <div id="modalList"></div>
    </div>
  </div>

  <!-- مدال لیست کانال‌ها -->
  <div id="channelsModalOverlay" class="modal-overlay" onclick="closeChannelsModalOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h2>لیست کانال‌ها</h2>
        <button onclick="closeChannelsModal()">✕ بستن</button>
      </div>
      <div class="modal-search-area">
        <input type="text" id="searchChannelsModal" placeholder="جستجوی کانال..." oninput="filterChannelsModal()" />
      </div>
      <div id="channelsModalList"></div>
    </div>
  </div>

  <script>
    const REFRESH_INTERVAL_MS = 10000; // هر چند ثانیه جدول خودکار بروز شود
    const CHANNEL_PREVIEW_DEBOUNCE_MS = 450;
    const ROWS_PER_PAGE = 10;

    let allAnalyticsData = [];
    let currentPage = 1;

    let currentModalAds = [];
    let modalOpenCarName = null;
    let modalOpenTrim = null; // null یعنی گروه «بدون تیپ مشخص»
    let allChannels = [];
    let channelPreviewTimeout = null;

    function formatToman(amount) {
      if (amount === null || amount === undefined) return '<span class="no-price">—</span>';
      return amount.toLocaleString("fa-IR") + " تومان";
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString("fa-IR");
      } catch {
        return iso;
      }
    }

    // ---------- جدول قیمت‌ها (با صفحه‌بندی) ----------

    async function load() {
      const tbody = document.querySelector("#result tbody");

      try {
        const res = await fetch(`/api/car-ads-analytics`);
        const json = await res.json();

        if (json.error) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty-cell">❌ ${json.error}</td></tr>`;
          return;
        }

        allAnalyticsData = json.data;
        renderTable();

        if (modalOpenCarName) {
          refreshModal(modalOpenCarName, modalOpenTrim);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-cell">❌ خطا در دریافت اطلاعات: ${err.message}</td></tr>`;
      }
    }

    function getFilteredData() {
      const q = document.getElementById("searchTable").value.trim().toLowerCase();
      if (!q) return allAnalyticsData;
      return allAnalyticsData.filter((item) => item.display_name.toLowerCase().includes(q));
    }

    function renderTable() {
      const tbody = document.querySelector("#result tbody");
      const filtered = getFilteredData();
      const totalPages = Math.max(1, Math.ceil(filtered.length / ROWS_PER_PAGE));
      currentPage = Math.min(Math.max(1, currentPage), totalPages);

      const startIdx = (currentPage - 1) * ROWS_PER_PAGE;
      const pageItems = filtered.slice(startIdx, startIdx + ROWS_PER_PAGE);

      tbody.innerHTML = "";

      if (pageItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-cell">نتیجه‌ای پیدا نشد</td></tr>`;
      } else {
        pageItems.forEach((item, i) => {
          const tr = document.createElement("tr");
          tr.onclick = () => openModal(item.car_name, item.trim, item.display_name);
          tr.innerHTML = `
            <td class="row-num">${(startIdx + i + 1).toLocaleString("fa-IR")}</td>
            <td>${item.display_name}</td>
            <td>${item.total_ads.toLocaleString("fa-IR")}</td>
            <td>${item.priced_ads.toLocaleString("fa-IR")}</td>
            <td>${formatToman(item.min_price)}</td>
            <td>${formatToman(item.avg_price)}</td>
            <td>${formatToman(item.max_price)}</td>
            <td>${formatDate(item.last_seen)}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("resultCount").textContent =
        filtered.length > 0 ? `${filtered.length.toLocaleString("fa-IR")} نتیجه` : "";

      renderPagination(filtered.length, totalPages);
    }

    function renderPagination(totalCount, totalPages) {
      const container = document.getElementById("pagination");

      if (totalCount === 0) {
        container.innerHTML = "";
        return;
      }

      container.innerHTML = `
        <span class="pagination-info">صفحه ${currentPage.toLocaleString("fa-IR")} از ${totalPages.toLocaleString("fa-IR")}</span>
        <div class="pagination-buttons">
          <button id="prevPageBtn" ${currentPage <= 1 ? "disabled" : ""}>قبلی</button>
          <button id="nextPageBtn" ${currentPage >= totalPages ? "disabled" : ""}>بعدی</button>
        </div>
      `;

      document.getElementById("prevPageBtn").onclick = () => {
        currentPage--;
        renderTable();
      };
      document.getElementById("nextPageBtn").onclick = () => {
        currentPage++;
        renderTable();
      };
    }

    function onSearchInput() {
      currentPage = 1;
      renderTable();
    }

    // ---------- مدال جزئیات هر مدل ----------

    async function openModal(carName, trim, displayName) {
      modalOpenCarName = carName;
      modalOpenTrim = trim || null;
      document.getElementById("modalTitle").textContent = displayName || carName;
      document.getElementById("modalMeta").textContent = "در حال بارگذاری...";
      document.getElementById("modalList").innerHTML = "";
      document.getElementById("searchModal").value = "";
      document.getElementById("modalOverlay").style.display = "flex";
      await refreshModal(carName, modalOpenTrim);
    }

    async function refreshModal(carName, trim) {
      try {
        let url = `/api/car-ads-ads?car_name=${encodeURIComponent(carName)}`;
        if (trim) {
          url += `&trim=${encodeURIComponent(trim)}`;
        }
        const res = await fetch(url);
        const json = await res.json();

        if (json.error) {
          document.getElementById("modalMeta").textContent = "❌ " + json.error;
          return;
        }

        currentModalAds = json.data;
        filterModalAds();

        const prices = currentModalAds
          .map((ad) => ad.price_amount)
          .filter((p) => p !== null && p !== undefined);

        let metaText = `${json.count.toLocaleString("fa-IR")} آگهی`;
        if (prices.length > 0) {
          const min = Math.min(...prices);
          const max = Math.max(...prices);
          metaText += ` — کمترین قیمت: ${formatToman(min)} — بیشترین قیمت: ${formatToman(max)}`;
        }
        document.getElementById("modalMeta").innerHTML = metaText;
      } catch (err) {
        document.getElementById("modalMeta").textContent = "❌ خطا: " + err.message;
      }
    }

    function renderModalAds(ads) {
      const list = document.getElementById("modalList");
      list.innerHTML = "";

      if (ads.length === 0) {
        list.innerHTML = '<div class="empty">آگهی‌ای پیدا نشد</div>';
        return;
      }

      // کمترین/بیشترین قیمت همیشه از کل آگهی‌های این مدل محاسبه می‌شود
      // (نه فقط از زیرمجموعه‌ای که الان با سرچ فیلتر شده)، تا برچسب‌ها
      // با تغییر متن سرچ عوض/گم نشوند.
      const allPrices = currentModalAds
        .map((a) => a.price_amount)
        .filter((p) => p !== null && p !== undefined);
      const minPrice = allPrices.length ? Math.min(...allPrices) : null;
      const maxPrice = allPrices.length ? Math.max(...allPrices) : null;

      ads.forEach((ad) => {
        const priceText = ad.price_amount
          ? formatToman(ad.price_amount)
          : (ad.price_label ? ad.price_label : '<span class="no-price">بدون قیمت مشخص</span>');

        let badge = "";
        if (ad.price_amount !== null && ad.price_amount !== undefined) {
          if (minPrice === maxPrice) {
            badge = '<span class="price-badge equal">⭐ تنها قیمت موجود</span>';
          } else if (ad.price_amount === minPrice) {
            badge = '<span class="price-badge min">🔻 کمترین قیمت</span>';
          } else if (ad.price_amount === maxPrice) {
            badge = '<span class="price-badge max">🔺 بیشترین قیمت</span>';
          }
        }

        const detailsParts = [];
        if (ad.color) detailsParts.push("رنگ: " + ad.color);
        if (ad.trim) detailsParts.push("تیپ: " + ad.trim);
        if (ad.production_year) detailsParts.push("سال: " + ad.production_year);
        if (ad.mileage_km) detailsParts.push("کارکرد: " + ad.mileage_km.toLocaleString("fa-IR") + " کیلومتر");
        if (ad.city) detailsParts.push("شهر: " + ad.city);

        const card = document.createElement("div");
        card.className = "ad-card";
        card.innerHTML = `
          <div class="ad-row">
            <div class="price-group">
              <strong>${priceText}</strong>
              ${badge}
            </div>
            <a href="${ad.telegram_link}" target="_blank" rel="noopener" class="ad-link">مشاهده در تلگرام ↗</a>
          </div>
          ${detailsParts.length ? `<div class="ad-details">${detailsParts.join(" — ")}</div>` : ""}
          ${ad.phone ? `<div class="ad-phone">📞 ${ad.phone}</div>` : ""}
          ${ad.notes ? `<div class="ad-notes">${ad.notes}</div>` : ""}
          ${ad.message_text ? `<div class="ad-text">${ad.message_text}</div>` : ""}
          <div class="ad-date">${formatDate(ad.created_at)}</div>
        `;
        list.appendChild(card);
      });
    }

    function filterModalAds() {
      const q = document.getElementById("searchModal").value.trim().toLowerCase();
      if (!q) {
        renderModalAds(currentModalAds);
        return;
      }
      const filtered = currentModalAds.filter((ad) => {
        const haystack = [ad.phone, ad.color, ad.trim, ad.notes, ad.message_text, ad.city, ad.price_label]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return haystack.includes(q);
      });
      renderModalAds(filtered);
    }

    function closeModal() {
      modalOpenCarName = null;
      modalOpenTrim = null;
      document.getElementById("modalOverlay").style.display = "none";
    }

    function closeModalOnOverlay(event) {
      if (event.target.id === "modalOverlay") closeModal();
    }

    // ---------- پیش‌نمایش زنده‌ی نام کانال ----------

    function onChannelInputChange() {
      clearTimeout(channelPreviewTimeout);
      const username = document.getElementById("newChannelInput").value.trim().replace(/^@/, "");
      const previewEl = document.getElementById("channelPreview");

      if (!username) {
        previewEl.textContent = "";
        previewEl.className = "channel-preview";
        return;
      }

      previewEl.textContent = "در حال جستجو...";
      previewEl.className = "channel-preview loading";

      channelPreviewTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`/api/car-ads-channel-preview?username=${encodeURIComponent(username)}`);
          const json = await res.json();
          if (json.found) {
            previewEl.textContent = "✅ " + json.title;
            previewEl.className = "channel-preview found";
          } else {
            previewEl.textContent = "❌ کانالی با این نام پیدا نشد";
            previewEl.className = "channel-preview not-found";
          }
        } catch (err) {
          previewEl.textContent = "";
          previewEl.className = "channel-preview";
        }
      }, CHANNEL_PREVIEW_DEBOUNCE_MS);
    }

    // ---------- افزودن کانال ----------

    async function addChannel() {
      const input = document.getElementById("newChannelInput");
      const username = input.value.trim().replace(/^@/, "");
      if (!username) return;

      await fetch("/api/car-ads-channels", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username }),
      });

      input.value = "";
      document.getElementById("channelPreview").textContent = "";
      document.getElementById("channelPreview").className = "channel-preview";

      // اگه مدال لیست کانال‌ها باز بود، بروزش کن
      if (document.getElementById("channelsModalOverlay").style.display === "flex") {
        await loadChannelsModal();
      }
    }

    // ---------- مدال لیست کانال‌ها (سرچ + حذف) ----------

    async function openChannelsModal() {
      document.getElementById("searchChannelsModal").value = "";
      document.getElementById("channelsModalOverlay").style.display = "flex";
      await loadChannelsModal();
    }

    async function loadChannelsModal() {
      const list = document.getElementById("channelsModalList");
      list.innerHTML = '<div class="empty">در حال بارگذاری...</div>';
      try {
        const res = await fetch("/api/car-ads-channels");
        const json = await res.json();
        allChannels = json.data || [];
        filterChannelsModal();
      } catch (err) {
        list.innerHTML = `<div class="empty">❌ خطا: ${err.message}</div>`;
      }
    }

    function filterChannelsModal() {
      const q = document.getElementById("searchChannelsModal").value.trim().toLowerCase();
      const filtered = allChannels.filter((ch) => ch.username.toLowerCase().includes(q));
      renderChannelsModal(filtered);
    }

    function renderChannelsModal(channels) {
      const list = document.getElementById("channelsModalList");
      list.innerHTML = "";

      if (channels.length === 0) {
        list.innerHTML = '<div class="empty">کانالی پیدا نشد</div>';
        return;
      }

      channels.forEach((ch) => {
        const row = document.createElement("div");
        row.className = "channel-row";
        row.innerHTML = `
          <span class="channel-name">@${ch.username}</span>
          <span class="channel-status ${ch.active ? "active" : "inactive"}">${ch.active ? "فعال" : "غیرفعال"}</span>
        `;
        const btn = document.createElement("button");
        btn.textContent = ch.active ? "حذف" : "فعال‌سازی";
        btn.onclick = async () => {
          if (ch.active) {
            await fetch(`/api/car-ads-channels/${encodeURIComponent(ch.username)}`, { method: "DELETE" });
          } else {
            await fetch("/api/car-ads-channels", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: ch.username }),
            });
          }
          await loadChannelsModal();
        };
        row.appendChild(btn);
        list.appendChild(row);
      });
    }

    function closeChannelsModal() {
      document.getElementById("channelsModalOverlay").style.display = "none";
    }

    function closeChannelsModalOnOverlay(event) {
      if (event.target.id === "channelsModalOverlay") closeChannelsModal();
    }

    load();
    setInterval(load, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
